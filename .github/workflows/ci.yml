name: CI

on:
  # Every branch, every push. A gate that only runs on main tells you about the breakage after
  # it is already shared; on a feature branch it tells the person who wrote it, while they are
  # still holding the context.
  push:
  # Adds pull requests opened from forks, whose commits never triggered the push event above.
  pull_request:

# One run per branch. A second push cancels the first instead of queueing behind it - otherwise
# running on every branch multiplies both wait time and billed minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Without this, every pull request inside this repository runs twice: once for the push to
    # its branch and once for the pull_request event. Fork PRs still run, because their push
    # never reached this repository.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # `make ci` restaura dependencias y corre scripts del checkout: no necesita escribir nada.
    # Sin este bloque el token hereda los permisos por defecto del repo, que pueden ser de escritura.
    permissions:
      contents: read

    steps:
      # gitleaks scans history, so it needs the full clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Puts the binary on PATH so `make ci` can run the single scan the Makefile defines.
      # Deliberately NOT gitleaks/gitleaks-action: that action runs its own scan instead of
      # exposing the binary, and it requires a licence key for organisation-owned repos.
      #
      # The version is pinned, not resolved on every run. A pipeline that fetches "latest" runs a
      # different binary tomorrow than it ran today, with nothing recording the change. Bump it
      # the way you bump any other dependency.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify before extracting. Without this the pin only says which URL was fetched, not
          # what came back from it.
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          # No sudo: a writable directory on PATH is enough, and a CI step that escalates to
          # install a linter is a habit worth not forming.
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$ARCHIVE" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # With lock files, packages.lock.json IS the resolved graph - hashing every .csproj on
          # top of it only busts the cache on edits that cannot change what gets restored.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # El frontend vive fuera del .sln y sus compuertas cuelgan de `make ci`. Estos dos pasos
      # solo ponen pnpm y Node en PATH; los comandos siguen viviendo en el Makefile.
      #
      # pnpm va ANTES de setup-node: `cache: pnpm` necesita el binario para preguntarle donde
      # tiene el store. La version sale del campo `packageManager` de package.json, que es
      # tambien el que usa la maquina de cada quien.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Presentation/TheOffice.Web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: src/Presentation/TheOffice.Web/.nvmrc
          cache: pnpm
          cache-dependency-path: src/Presentation/TheOffice.Web/pnpm-lock.yaml

      # One definition of "the code is fine". Restating the steps here would guarantee drift the
      # first time someone adds a check to the Makefile. `make ci` restores in locked mode, so a
      # packages.lock.json that has drifted from its project fails the build - that is the point.
      - name: Run the same gates as local
        run: make ci

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

# Branch protection is what turns this from a report into a gate:
# Settings > Branches > require the `check` status check before merging.
#
# Do NOT add paths-ignore to skip docs-only commits once `check` is a required status check: the
# skipped run never reports, and the pull request waits for a check that will never arrive.
