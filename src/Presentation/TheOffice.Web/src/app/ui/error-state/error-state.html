<div role="alert" class="rounded-lg border border-border bg-surface p-8 text-center">
  <h2 class="font-display text-h3-card text-primary-900">{{ title() }}</h2>

  <p class="mt-2 text-body text-text-body">{{ message() }}</p>

  <div class="mt-6 flex items-center justify-center">
    <app-button data-testid="retry-button" (pressed)="retry.emit()">{{ retryLabel() }}</app-button>
  </div>
</div>
